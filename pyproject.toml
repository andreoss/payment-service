[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501", # line length is enforced by the formatter, not worth hard-failing lint on
]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["UP"] # generated by the alembic template, not hand-maintained style

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/Query()/... are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# 70 reflects reality when the whole suite (unit + integration) runs: business
# logic (api/, services/, schemas, webhook, payment_processor, retry_policy)
# sits at 95-100%. The rest (consumer.py, main.py's lifespan, outbox_relay,
# rabbitmq*, db.py) is thin IO/framework wiring exercised by the integration
# suite against the live api/consumer containers, which coverage.py can't see
# since that code runs in a different process. See README's Tests section.
fail_under = 70
exclude_also = [
    "if __name__ == .__main__.:",
]
